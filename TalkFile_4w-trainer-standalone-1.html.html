<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>4W Combo Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Oxanium:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: thumb clusters pinned to both screen edges, board flanked by HOLD and NEXT in the middle */
:root{
  --bg:#0c0d13;
  --panel:#151722;
  --panel-hi:#1e2130;
  --line:#2b2f40;
  --fg:#eef0f7;
  --muted:#8b90a6;
  --accent:#b46bff;
  --accent-ink:#14091f;
  --good:#47d6a8;
  --font-display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --font-num:'Oxanium',ui-monospace,'SF Mono',monospace;
  --btn:clamp(62px,11.5vmin,108px);
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);overflow:hidden;
  overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--font-display);
}
.app{
  height:100%;display:grid;grid-template-rows:auto 1fr;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 12px;box-sizing:border-box;
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:800;font-size:28px;letter-spacing:.04em;color:var(--accent)}
.brand span{font-size:14px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.chip{
  font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em;
  color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;cursor:pointer;
}
.chip:focus-visible,.pad:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.reset{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--font-num);color:var(--accent);margin-left:6px}

main{
  min-height:0;display:grid;gap:12px;align-items:center;
  grid-template-columns:1fr auto 1fr;grid-template-areas:"left stage right";
}
.cluster-left{grid-area:left;justify-self:start;display:grid;gap:12px;
  grid-template-columns:repeat(2,var(--btn));grid-template-areas:"hold r180" "ccw drop"}
.cluster-right{grid-area:right;justify-self:end;display:grid;gap:8px;
  grid-template-columns:repeat(3,var(--btn));grid-template-rows:repeat(3,var(--btn));
  grid-template-areas:". up ." "left . right" ". down ."}
@media (orientation:portrait){
  main{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"stage stage" "left right"}
  .stage{justify-self:center}
}

.pad{
  width:var(--btn);height:var(--btn);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  color:var(--fg);font-family:var(--font-display);font-weight:700;
  font-size:calc(var(--btn)*.2);letter-spacing:.08em;cursor:pointer;
  touch-action:none;transition:transform .05s,background .05s;
}
.pad small{font-size:.62em;color:var(--muted);letter-spacing:.14em}
.pad svg{width:42%;height:42%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pad.on{background:var(--panel-hi);transform:scale(.94);border-color:var(--accent)}
.pad.drop{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pad.drop small{color:var(--accent-ink);opacity:.7}
.pad.drop.on{background:#d3a4ff}
.pad.r180{font-family:var(--font-num)}
[data-a=hold]{grid-area:hold}[data-a=r180]{grid-area:r180}[data-a=ccw]{grid-area:ccw}[data-a=drop]{grid-area:drop}
[data-a=cw]{grid-area:up}[data-a=left]{grid-area:left}[data-a=right]{grid-area:right}[data-a=down]{grid-area:down}

.stage{grid-area:stage;height:100%;min-height:0;display:flex;align-items:flex-start;justify-content:center;gap:10px}
.side{display:flex;flex-direction:column;gap:10px}
.box{background:rgba(8,9,13,.92);border:2px solid var(--fg);border-radius:4px 4px 4px 4px}
.label{display:block;font-weight:800;font-size:15px;letter-spacing:.12em;padding:2px 6px;background:var(--fg);color:var(--bg)}
canvas{display:block}
.hud{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.combo{line-height:.9}
.combo .big{font-family:var(--font-num);font-weight:700;font-size:clamp(34px,7vmin,72px);color:var(--fg);font-variant-numeric:tabular-nums}
.combo .cap{font-size:14px;font-weight:800;letter-spacing:.2em;color:var(--accent)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;letter-spacing:.12em;color:var(--muted)}
.rows b{font-family:var(--font-num);font-weight:500;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:0}
.toast{min-height:5.4em;display:flex;flex-direction:column;gap:2px;font-weight:800;letter-spacing:.06em;line-height:1.05}
.toast .spin{color:var(--accent);font-size:clamp(14px,2.6vmin,22px)}
.toast .clr{font-size:clamp(16px,3vmin,26px)}
.toast .cb{font-family:var(--font-num);font-size:clamp(16px,3vmin,26px);color:var(--good)}
.toast .pc{color:#ffd65a;font-size:clamp(16px,3vmin,26px)}
.toast.show{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-6px)}8%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}
.board-wrap{position:relative}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(12,13,19,.86);text-align:center;padding:12px}
.overlay h2{margin:0;font-size:30px;letter-spacing:.12em}
.overlay p{margin:0;color:var(--muted);font-size:15px;letter-spacing:.08em}
.overlay p b{font-family:var(--font-num);color:var(--fg)}
.newpb{color:#ffd65a;font-weight:800;letter-spacing:.14em}

.modal{position:fixed;inset:0;background:rgba(5,6,10,.7);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(420px,100%);box-sizing:border-box;max-height:85vh;overflow:auto;font-family:system-ui,sans-serif}
.sheet h3{margin:0 0 4px;font-family:var(--font-display);font-size:24px;letter-spacing:.1em}
.best{display:flex;align-items:baseline;gap:10px;margin:8px 0 14px}
.best .v{font-family:var(--font-num);font-size:56px;font-weight:700;color:var(--accent);line-height:1}
.best .u{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td.num{font-family:var(--font-num);text-align:right}
th.num{text-align:right}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.sheet-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.ghostbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.ghostbtn.danger{color:#ff7a80;border-color:#5a2a30}
.keys{color:var(--muted);font-size:12px;line-height:1.6;margin-top:14px}
@media (prefers-reduced-motion:reduce){.toast.show{animation:none}.pad{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>4W</b><span>Combo Trainer · SRS-X · All-Mini+</span></div>
    <div class="top-actions">
      <button class="chip" id="pbBtn" type="button">PB<span class="n" id="pbTop">0</span></button>
      <button class="chip reset" id="resetBtn" type="button">RESET</button>
    </div>
  </header>

  <main>
    <div class="cluster-left">
      <button class="pad" data-a="hold" type="button">HOLD</button>
      <button class="pad r180" data-a="r180" type="button">180<small>SPIN</small></button>
      <button class="pad" data-a="ccw" type="button" aria-label="반시계 회전">
        <svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M19.5 13a7.5 7.5 0 1 1-2.2-6.3"/><path d="M19.5 3.5v5h-5"/></svg><small>CCW</small>
      </button>
      <button class="pad drop" data-a="drop" type="button">DROP<small>HARD</small></button>
    </div>

    <div class="stage" id="stage">
      <div class="side" id="leftSide">
        <div class="box"><span class="label">HOLD</span><canvas id="holdC"></canvas></div>
        <div class="toast" id="toast"></div>
        <div class="hud">
          <div class="combo"><div class="big" id="comboN">0</div><div class="cap">COMBO</div></div>
          <div class="rows">
            <span>MAX</span><b id="maxN">0</b>
            <span>PB</span><b id="pbN">0</b>
            <span>LINES</span><b id="linesN">0</b>
            <span>PIECES</span><b id="piecesN">0</b>
          </div>
        </div>
      </div>
      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div class="overlay" id="over" hidden>
          <h2>TOP OUT</h2>
          <p>MAX COMBO <b id="ovCombo">0</b></p>
          <p>LINES <b id="ovLines">0</b> · PIECES <b id="ovPieces">0</b></p>
          <div class="newpb" id="ovPb" hidden>NEW PERSONAL BEST</div>
          <button class="chip reset" id="againBtn" type="button">RETRY</button>
        </div>
      </div>
      <div class="side">
        <div class="box"><span class="label">NEXT</span><canvas id="nextC"></canvas></div>
      </div>
    </div>

    <div class="cluster-right">
      <button class="pad" data-a="cw" type="button" aria-label="시계 회전">
        <svg viewBox="0 0 24 24"><path d="M19.5 13a7.5 7.5 0 1 1-2.2-6.3"/><path d="M19.5 3.5v5h-5"/></svg><small>CW</small>
      </button>
      <button class="pad" data-a="left" type="button" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pad" data-a="right" type="button" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="pad" data-a="down" type="button" aria-label="소프트 드롭"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg><small>SOFT</small></button>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-labelledby="pbTitle">
    <h3 id="pbTitle">PERSONAL BEST</h3>
    <div class="best"><span class="v" id="mBest">0</span><span class="u" id="mBestSub">아직 기록이 없어요</span></div>
    <div id="mList"></div>
    <div class="sheet-actions">
      <button class="ghostbtn danger" id="clearBtn" type="button">기록 지우기</button>
      <button class="chip" id="closeBtn" type="button">닫기</button>
    </div>
    <div class="keys">키보드: ← → 이동 · ↓ 소프트드롭 · ↑/X 시계 · Z 반시계 · A 180° · C/Shift 홀드 · Space 하드드롭 · R 리셋<br>기록은 이 기기의 브라우저에만 저장됩니다.</div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- rules ----------
const W = 4, VIS = 9, BUF = 4, H = VIS + BUF, PEEK = 1.5;
const DAS = 167, ARR = 33, SOFT = 20;          // DAS 10f, ARR 2f @60fps; gravity 0
const COL = {I:'#33d6a6',O:'#e9c440',T:'#d653d4',S:'#94d43d',Z:'#e9474f',J:'#6a52d9',L:'#e8813b',G:'#5d616c'};
const BASE = {
  I:{n:4,c:[[1,0],[1,1],[1,2],[1,3]]},
  O:{n:2,c:[[0,0],[0,1],[1,0],[1,1]]},
  T:{n:3,c:[[0,1],[1,0],[1,1],[1,2]]},
  S:{n:3,c:[[0,1],[0,2],[1,0],[1,1]]},
  Z:{n:3,c:[[0,0],[0,1],[1,1],[1,2]]},
  J:{n:3,c:[[0,0],[1,0],[1,1],[1,2]]},
  L:{n:3,c:[[0,2],[1,0],[1,1],[1,2]]}
};
const SH = {};
for (const t in BASE) {
  const {n,c} = BASE[t]; SH[t] = [c];
  for (let r = 1; r < 4; r++) SH[t].push(SH[t][r-1].map(([y,x]) => [x, n-1-y]));
}
// kicks: [x, y] with +y = up
const K_N = {'0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  '3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]};
const K_I = {'0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],'1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
  '1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],'2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],'3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],'0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]};
const K180_N = {
  '0>2':[[0,0],[1,0],[2,0],[1,1],[2,1],[-1,0],[-2,0],[-1,1],[-2,1],[0,-1],[3,0],[-3,0]],
  '1>3':[[0,0],[0,1],[0,2],[-1,1],[-1,2],[0,-1],[0,-2],[-1,-1],[-1,-2],[1,0],[0,3],[0,-3]],
  '2>0':[[0,0],[-1,0],[-2,0],[-1,-1],[-2,-1],[1,0],[2,0],[1,-1],[2,-1],[0,1],[-3,0],[3,0]],
  '3>1':[[0,0],[0,1],[0,2],[1,1],[1,2],[0,-1],[0,-2],[1,-1],[1,-2],[-1,0],[0,3],[0,-3]]};
const K180_I = {
  '0>2':[[0,0],[-1,0],[-2,0],[1,0],[2,0],[0,1]],
  '1>3':[[0,0],[0,1],[0,2],[0,-1],[0,-2],[-1,0]],
  '2>0':[[0,0],[1,0],[2,0],[-1,0],[-2,0],[0,-1]],
  '3>1':[[0,0],[0,1],[0,2],[0,-1],[0,-2],[1,0]]};

// ---------- storage ----------
const KEY = '4w-trainer-v1';
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.runs)) return s; } catch(e){} return {runs:[]}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
let store = load();
const storedBest = () => store.runs.length ? store.runs[0].combo : 0;

// ---------- state ----------
let board, cur, hold, holdUsed, queue, ren, maxCombo, pieces, lines, over, lastRot, lastKick, runSaved, pbAnnounced, dirty = true;

function refill(){
  while (queue.length < 7) {
    const b = ['I','O','T','S','Z','J','L'];
    for (let i = b.length-1; i > 0; i--) { const j = Math.random()*(i+1)|0; [b[i],b[j]] = [b[j],b[i]]; }
    queue.push(...b);
  }
}
function fits(t,r,x,y){
  for (const [cy,cx] of SH[t][r]) {
    const yy = y+cy, xx = x+cx;
    if (xx < 0 || xx >= W || yy < 0 || yy >= H) return false;
    if (board[yy][xx]) return false;
  }
  return true;
}
function spawn(t){
  const n = BASE[t].n, x = Math.floor((W-n)/2);
  const top = Math.min(...SH[t][0].map(c => c[0]));
  const y = BUF - top;
  lastRot = false; lastKick = -1;
  for (const dy of [0,-1,-2,-3]) if (fits(t,0,x,y+dy)) { cur = {t, r:0, x, y:y+dy}; return true; }
  cur = {t, r:0, x, y}; return false;
}
function nextPiece(){ refill(); const t = queue.shift(); refill(); if (!spawn(t)) gameOver(); }

function init(){
  board = Array.from({length:H}, () => Array(W).fill(null));
  const hole = Math.random()*W|0;
  for (let x = 0; x < W; x++) if (x !== hole) board[H-1][x] = 'G';
  queue = []; hold = null; holdUsed = false; ren = 0; maxCombo = 0; pieces = 0; lines = 0;
  over = false; runSaved = false; pbAnnounced = false;
  $over.hidden = true; $toast.className = 'toast'; $toast.innerHTML = '';
  nextPiece(); hud(); dirty = true;
}

function move(dx,dy){
  if (over) return false;
  if (fits(cur.t,cur.r,cur.x+dx,cur.y+dy)) { cur.x += dx; cur.y += dy; lastRot = false; dirty = true; return true; }
  return false;
}
function rotate(d){
  if (over || cur.t === 'O') return;
  const from = cur.r, to = (from+d+4)%4, key = from+'>'+to;
  const tbl = d === 2 ? (cur.t === 'I' ? K180_I : K180_N) : (cur.t === 'I' ? K_I : K_N);
  const ks = tbl[key];
  for (let i = 0; i < ks.length; i++) {
    const nx = cur.x + ks[i][0], ny = cur.y - ks[i][1];
    if (fits(cur.t,to,nx,ny)) { cur.r = to; cur.x = nx; cur.y = ny; lastRot = true; lastKick = d === 2 ? -1 : i; dirty = true; return; }
  }
}
function doHold(){
  if (over || holdUsed) return;
  const t = cur.t;
  if (hold) { const h = hold; hold = t; if (!spawn(h)) gameOver(); }
  else { hold = t; nextPiece(); }
  holdUsed = true; dirty = true;
}
function ghostY(){ let y = cur.y; while (fits(cur.t,cur.r,cur.x,y+1)) y++; return y; }
// soft drop = infinite SDF: piece snaps to the floor instantly but does not lock
function sonicDrop(){
  if (over) return;
  const gy = ghostY();
  if (gy !== cur.y) { cur.y = gy; lastRot = false; dirty = true; }
}
function hardDrop(){
  if (over) return;
  const gy = ghostY();
  if (gy !== cur.y) { cur.y = gy; lastRot = false; }
  lock();
}
// All-Mini+: T uses 3-corner (full/mini), every other piece that is immobile after a rotation = mini
function detectSpin(){
  if (!lastRot) return null;
  const {t,r,x,y} = cur;
  const immobile = !fits(t,r,x-1,y) && !fits(t,r,x+1,y) && !fits(t,r,x,y-1) && !fits(t,r,x,y+1);
  if (t === 'T') {
    const occ = (cx,cy) => { const xx = x+cx, yy = y+cy; return (xx<0||xx>=W||yy<0||yy>=H) ? true : !!board[yy][xx]; };
    const c = [occ(0,0), occ(2,0), occ(2,2), occ(0,2)];
    const n = c.filter(Boolean).length;
    const f = [[0,1],[1,2],[2,3],[3,0]][r];
    if (n >= 3) return ((c[f[0]] && c[f[1]]) || lastKick === 4) ? 'full' : 'mini';
    return immobile ? 'mini' : null;
  }
  return immobile ? 'mini' : null;
}
const NAMES = ['','SINGLE','DOUBLE','TRIPLE','QUAD'];
function lock(){
  const spin = detectSpin(), t = cur.t;
  for (const [cy,cx] of SH[t][cur.r]) board[cur.y+cy][cur.x+cx] = t;
  const keep = board.filter(row => !row.every(Boolean));
  const cleared = H - keep.length;
  board = [...Array.from({length:cleared}, () => Array(W).fill(null)), ...keep];
  pieces++; lines += cleared;
  if (cleared) ren++; else ren = 0;
  const combo = ren - 1;
  if (combo > maxCombo) maxCombo = combo;
  const pc = cleared > 0 && board.every(row => row.every(c => !c));
  announce(spin, t, cleared, combo, pc);
  holdUsed = false;
  nextPiece();
  hud(); dirty = true;
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const $toast = $('toast'), $over = $('over');
function announce(spin, t, cleared, combo, pc){
  let html = '';
  if (spin) html += `<span class="spin">${t}-SPIN${spin === 'mini' ? ' MINI' : ''}</span>`;
  if (cleared) html += `<span class="clr">${NAMES[cleared]}</span>`;
  if (cleared && combo >= 1) html += `<span class="cb">${combo} COMBO</span>`;
  if (pc) html += `<span class="pc">ALL CLEAR</span>`;
  if (!pbAnnounced && maxCombo > storedBest() && maxCombo > 0 && store.runs.length) { html += `<span class="pc">NEW PB</span>`; pbAnnounced = true; }
  if (!html) return;
  $toast.innerHTML = html;
  $toast.classList.remove('show'); void $toast.offsetWidth; $toast.classList.add('show');
}
function hud(){
  $('comboN').textContent = Math.max(0, ren-1);
  $('maxN').textContent = maxCombo;
  const pb = Math.max(storedBest(), maxCombo);
  $('pbN').textContent = pb; $('pbTop').textContent = pb;
  $('linesN').textContent = lines; $('piecesN').textContent = pieces;
}
function saveRun(){
  if (runSaved || pieces === 0) return false;
  runSaved = true;
  const isPb = maxCombo > storedBest();
  store.runs.push({combo:maxCombo, lines, pieces, date:Date.now()});
  store.runs.sort((a,b) => b.combo - a.combo || a.pieces - b.pieces || a.date - b.date);
  store.runs = store.runs.slice(0,10);
  persist();
  return isPb && maxCombo > 0;
}
function gameOver(){
  over = true; releaseAll();
  const pb = saveRun();
  $('ovCombo').textContent = maxCombo; $('ovLines').textContent = lines; $('ovPieces').textContent = pieces;
  $('ovPb').hidden = !pb; $over.hidden = false; hud(); dirty = true;
}
function reset(){ saveRun(); init(); }

// ---------- drawing ----------
const bc = $('board'), bx = bc.getContext('2d');
const hc = $('holdC'), hx = hc.getContext('2d');
const nc = $('nextC'), nx = nc.getContext('2d');
let S = 40, M = 3, dpr = 1;

function cell(g, px, py, s, color, alpha=1){
  g.globalAlpha = alpha;
  const p = Math.max(1, s*.03);
  g.fillStyle = color; g.fillRect(px+p, py+p, s-2*p, s-2*p);
  g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(px+p, py+p, s-2*p, s*.09); g.fillRect(px+p, py+p, s*.09, s-2*p);
  g.fillStyle = 'rgba(0,0,0,.24)'; g.fillRect(px+p, py+s-p-s*.09, s-2*p, s*.09); g.fillRect(px+s-p-s*.09, py+p, s*.09, s-2*p);
  g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = s*.05; g.strokeRect(px+s*.26, py+s*.26, s*.48, s*.48);
  g.globalAlpha = 1;
}
function drawBoard(){
  const g = bx, cw = W*S + 2*M, ch = (VIS+PEEK)*S + M, top = PEEK*S;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cw,ch);
  g.fillStyle = 'rgba(8,9,13,.94)'; g.fillRect(M, top, W*S, VIS*S);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1;
  for (let x = 1; x < W; x++) { g.beginPath(); g.moveTo(M+x*S+.5, top); g.lineTo(M+x*S+.5, top+VIS*S); g.stroke(); }
  for (let y = 1; y < VIS; y++) { g.beginPath(); g.moveTo(M, top+y*S+.5); g.lineTo(M+W*S, top+y*S+.5); g.stroke(); }
  const py = y => top + (y-BUF)*S;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (board[y][x]) cell(g, M+x*S, py(y), S, COL[board[y][x]], over ? .5 : 1);
  if (!over) {
    const gy = ghostY();
    for (const [cy,cx] of SH[cur.t][cur.r]) cell(g, M+(cur.x+cx)*S, py(gy+cy), S, COL[cur.t], .28);
    for (const [cy,cx] of SH[cur.t][cur.r]) cell(g, M+(cur.x+cx)*S, py(cur.y+cy), S, COL[cur.t]);
  }
  g.strokeStyle = '#eef0f7'; g.lineWidth = M;
  g.beginPath(); g.moveTo(M/2, top); g.lineTo(M/2, top+VIS*S+M/2); g.lineTo(M+W*S+M/2, top+VIS*S+M/2); g.lineTo(M+W*S+M/2, top); g.stroke();
}
function mini(g, t, cx, cy, ms, alpha=1){
  const cs = SH[t][0];
  const r0 = Math.min(...cs.map(c=>c[0])), r1 = Math.max(...cs.map(c=>c[0]));
  const c0 = Math.min(...cs.map(c=>c[1])), c1 = Math.max(...cs.map(c=>c[1]));
  const ox = cx - (c1-c0+1)*ms/2, oy = cy - (r1-r0+1)*ms/2;
  for (const [r,c] of cs) cell(g, ox+(c-c0)*ms, oy+(r-r0)*ms, ms, COL[t], alpha);
}
function drawSide(){
  const pw = 2.8*S, ms = S*.58;
  hx.setTransform(dpr,0,0,dpr,0,0); hx.clearRect(0,0,pw,1.9*S);
  if (hold) mini(hx, hold, pw/2, .95*S, ms, holdUsed ? .35 : 1);
  const slot = 1.55*S;
  nx.setTransform(dpr,0,0,dpr,0,0); nx.clearRect(0,0,pw,slot*5+.3*S);
  for (let i = 0; i < 5; i++) mini(nx, queue[i], pw/2, .2*S + slot*i + slot/2, ms);
}
function draw(){ drawBoard(); drawSide(); }

function sizeCanvas(c, w, h){
  c.style.width = w+'px'; c.style.height = h+'px';
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
}
function layout(){
  dpr = window.devicePixelRatio || 1;
  const stage = $('stage'), main = stage.parentElement;
  const portrait = matchMedia('(orientation:portrait)').matches;
  const L = document.querySelector('.cluster-left'), R = document.querySelector('.cluster-right');
  const availH = stage.clientHeight;
  const availW = portrait ? main.clientWidth : main.clientWidth - L.offsetWidth - R.offsetWidth - 24;
  M = 3;
  const sH = (availH - M - 4) / (VIS + PEEK);
  const sW = (availW - 20 - 2*M - 8) / (W + 2*2.8);
  S = Math.max(14, Math.floor(Math.min(sH, sW)));
  sizeCanvas(bc, W*S + 2*M, (VIS+PEEK)*S + M);
  sizeCanvas(hc, 2.8*S, 1.9*S);
  sizeCanvas(nc, 2.8*S, 1.55*S*5 + .3*S);
  document.querySelectorAll('.side').forEach(el => { el.style.width = (2.8*S + 4)+'px'; el.style.paddingTop = (PEEK*S)+'px'; el.style.height = ((VIS+PEEK)*S + M)+'px'; el.style.boxSizing = 'border-box'; });
  dirty = true;
}

// ---------- input ----------
const held = {left:false, right:false, down:false};
let dir = 0, arrNext = 0, softNext = 0;
function press(a){
  const t = performance.now();
  if (over && a !== 'reset') return;
  switch (a) {
    case 'left': case 'right':
      held[a] = true; dir = a === 'left' ? -1 : 1; move(dir,0); arrNext = t + DAS; break;
    case 'down': held.down = true; sonicDrop(); break;
    case 'cw': rotate(1); break;
    case 'ccw': rotate(-1); break;
    case 'r180': rotate(2); break;
    case 'hold': doHold(); break;
    case 'drop': hardDrop(); break;
  }
}
function release(a){
  if (a === 'left' || a === 'right') {
    held[a] = false;
    const other = a === 'left' ? 'right' : 'left';
    if (held[other]) { dir = other === 'left' ? -1 : 1; arrNext = performance.now() + DAS; } else dir = 0;
  } else if (a === 'down') held.down = false;
}
function releaseAll(){
  held.left = held.right = held.down = false; dir = 0;
  document.querySelectorAll('.pad.on').forEach(b => b.classList.remove('on'));
}
document.querySelectorAll('.pad').forEach(btn => {
  const a = btn.dataset.a;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { btn.setPointerCapture(e.pointerId); } catch(_){}
    btn.classList.add('on'); press(a);
  });
  const up = e => { if (!btn.classList.contains('on')) return; btn.classList.remove('on'); release(a); };
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
const KEYMAP = {ArrowLeft:'left', ArrowRight:'right', ArrowDown:'down', ArrowUp:'cw', KeyX:'cw', KeyZ:'ccw', ControlLeft:'ccw', ControlRight:'ccw',
  KeyA:'r180', KeyC:'hold', ShiftLeft:'hold', ShiftRight:'hold', Space:'drop'};
addEventListener('keydown', e => {
  if (!$('modal').hidden) { if (e.code === 'Escape') closeModal(); return; }
  if (e.code === 'KeyR') { e.preventDefault(); if (!e.repeat) reset(); return; }
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault(); if (e.repeat) return; press(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

function loop(t){
  if (!over) {
    if (dir && t >= arrNext) { let n = 0; while (t >= arrNext && n++ < 20) { move(dir,0); arrNext += ARR; } }
    if (held.down) sonicDrop();
  }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(loop);
}

// ---------- buttons / modal ----------
$('resetBtn').addEventListener('click', () => { reset(); $('resetBtn').blur(); });
$('againBtn').addEventListener('click', () => init());
function fmtDate(ms){ const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
let clearArmed = false;
function openModal(){
  saveCurrentPreview();
  const runs = store.runs;
  $('mBest').textContent = runs.length ? runs[0].combo : 0;
  $('mBestSub').textContent = runs.length ? `COMBO · ${fmtDate(runs[0].date)} · ${runs[0].pieces} pieces` : '아직 기록이 없어요. 한 판 끝내거나 RESET하면 저장돼요.';
  $('mList').innerHTML = runs.length
    ? `<table><thead><tr><th>#</th><th class="num">COMBO</th><th class="num">LINES</th><th class="num">PIECES</th><th class="num">날짜</th></tr></thead><tbody>${
        runs.map((r,i)=>`<tr><td>${i+1}</td><td class="num">${r.combo}</td><td class="num">${r.lines}</td><td class="num">${r.pieces}</td><td class="num">${fmtDate(r.date)}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">상위 10판의 최대 콤보가 여기에 쌓여요.</div>';
  clearArmed = false; $('clearBtn').textContent = '기록 지우기';
  $('modal').hidden = false; releaseAll();
}
function saveCurrentPreview(){ /* current run is saved on top-out or RESET, so an unfinished run is not listed */ }
function closeModal(){ $('modal').hidden = true; }
$('pbBtn').addEventListener('click', openModal);
$('closeBtn').addEventListener('click', closeModal);
$('modal').addEventListener('pointerdown', e => { if (e.target === $('modal')) closeModal(); });
$('clearBtn').addEventListener('click', () => {
  if (!clearArmed) { clearArmed = true; $('clearBtn').textContent = '한 번 더 눌러 삭제'; return; }
  store = {runs:[]}; persist(); hud(); openModal();
});

addEventListener('resize', layout);
init();
requestAnimationFrame(() => { layout(); requestAnimationFrame(loop); });
})();
</script>
